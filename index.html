<body>

            <div class="nav_bar_center">

                    <li><button id="cg-3">Button 3</button></li>
                    <li><button id="cg-4">Button 4</button></li>
                    <li><button id="cg-5">Button 5</button></li>

                        <option selected id="title_dd" value="0">More Meal Categories</option>
                        <option value="1" id="opt_1">One</option>

                        <option value="3" id="opt_3">Three</option>
                        <option value="4" id="opt_4">One</option>
                        <option value="5" id="opt_5">Two</option>
                        <option value="6" id="opt_6">Three</option>
                        <option value="7" id="opt_7">One</option>
                        <option value="8" id="opt_8">Two</option>
                        <option value="9" id="opt_9">Three</option>
                        <option value="10" id="opt_10">One</option>
                        <option value="11" id="opt_11">Two</option>
                        <option value="12" id="opt_12">Three</option>
                        <option value="13" id="opt_13">One</option>
                        <option value="14" id="opt_14">Two</option>
                    </select>

                </ul>
            </div>

            <div class="col-4">
                
            </div>

            <h5 style="margin-bottom: 15px; font-size: 18px; font-weight: normal;">All Recipes</h5>
        </div>

        <!-- <div class="album py-5 bg-body-tertiary"> -->
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="card_set">   

                <!-- Cards will be dynamically placed here -->

            </div>
        </div>
        <!-- </div> -->
    </div>

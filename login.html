<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_login.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row home_page">
            <div class="display_area">
                <div id="left_div">
                    <img src="assests/img/Logo.png" alt="" width="120px">
                    <h5 style="font-weight: bolder; font-size: 30px; color: #FD6A01; text-align: center;">RECIPE CLUB</h5>
                    
                    <div class="tag_line" style="margin-top: 90px;">
                        <p>FIND YOUR FAVOURITE RECIPES</p>
                    </div>
                    <div class="tag_line" style="margin-top: 20px;">
                        <p>CREATE YOUR OWN RECIPES</p>
                    </div>

                    <h6 class="join_us">JOIN US</h6>

                </div>

            </div>
            <div class="form_area">
                <div id="right_div" style="background-color: #81AD4E; border-radius: 20px; opacity: 75px;">
                    <h1 class="txt_welcome">WELCOME</h1>
                    <h5 class="club_name">TO RECIPE CLUB</h5>

                    <form class="form_div">
                        <div class="form-group row " style="margin-top: 30px;">
                            <div class="col-sm-3"></div>
                            <label for="inputUsername" class="col-sm-2 col-form-label input_name">User Name</label>
                            <div class="col-sm-5">
                                <input type="text" class="form-control" id="inputUsername" placeholder="User name">
                            </div>
                            <div class="col-sm-2"></div>

                        </div>
                        <div class="form-group row" style="margin-top: 20px;">
                            <div class="col-sm-3"></div>
                            <label for="inputEmail3" class="col-sm-2 col-form-label input_name">Email</label>
                            <div class="col-sm-5">
                                <input type="email" class="form-control" id="inputEmail3" placeholder="Email">
                            </div>
                            <div class="col-sm-2"></div>
                        </div>
                        <div class="form-group row" style="margin-top: 20px;">
                            <div class="col-sm-3"></div>
                            <label for="inputPassword3" class="col-sm-2 col-form-label input_name">Password</label>
                            <div class="col-sm-5">
                                <input type="password" class="form-control" id="inputPassword3" placeholder="Password">
                            </div>
                            <div class="col-sm-2"></div>
                        </div>
                        
                        
                        <div class="form-group row " style="margin-top: 20px;">
                            <div class="col-sm-10 button_div" style="display: flex; justify-content: end; margin-bottom: 25px;">
                                <button type="submit" class="btn" style="margin-right: 10px;">LOG IN</button>
                                <button type="submit" class="btn">SIGN UP</button>
                            </div>
                        </div>
                    </form>

                    
                </div>

                <div class="nav_dashboard" style="display: flex; justify-content: end;">
                    <a href="index.html" class="btn">>></a>
                </div>


            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app.js"></script>
</body>

</html>

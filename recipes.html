<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App_API Integration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_recipes.css">
</head>

<body>
    <!-- Nav Bar -->
    <div class="container-fluid nav_bar_main_div">
        <div class="row ">
            <div class="nav_bar_left">
                <img src="assests/img/Logo.png" alt="" width="75px">
                <label for="">RECIPE CLUB</label>
            </div>
            <div class="nav_bar_center">
                <a href="index.html">Home</a>
                <a href="" id="recipe_link_nav_bar">Recipes</a>
                <a href="">My Recipe Book</a>
            </div>
            <div class="nav_bar_right">
                <img src="assests/img/icon_signup.png" alt="">
                <img src="assests/img/icon_login.png" alt="">

            </div>
        </div>    
    </div> 
    
    <!-- Main Section -->
    <!-- Search bar -->
    <div class="container margin_redefined">
        <div class="row search_bar_div">
            <div class="col-6">
                <button class="btn button_back"><a href="index.html"><img src="assests/img/icon_back.png" alt="" width="20px"></a></button>
            </div>
            <div class="col search_bar">
                <input type="text" id="txt_search" placeholder="Type Recipe Name" style="font-size: 14px;">
                <button id="button_search"><img src="assests/img/icon_search.png" alt=""></button>
            </div>
        </div>
        
    </div>

    <div class="container margin_redefined">
        <div class="row" id="back_section">
            <div class="col-6 title_bar">
                <h5 class="fs-4" id="title">CHEESE PIZZA</h5>
            </div>
 
            <div class="col-6 add_recipe_btn">
                <button class="btn btn-light " >ADD MY RECIPE <img src="assests/img/icon_add.png" alt="" width="30px"></button>
            </div>
        </div>
    </div>

    <div class="container margin_redefined">
        <div class="row mb-2" id="thumb_img_section">
            <div class="col-8" >
                <div class="row" id="img_ingredient_section">
                    <div class="col" id="thumb_img_box">
                        <img src="" alt="" id="thumb_img" width="50%" height="95%" style="margin: 5px; border-radius: 5px;">
                    </div>
                    <div class="col" id="ingredient_box" >
                        <h5 style="font-size: 15px; font-weight: bold; padding: 10px;">Ingredients</h5>
                        <p>
                            <ul id="ingredient_list">
                                <li>Sugar 1 cup</li>
                                <li>Sugar 1 cup</li>
                            </ul>
                        </p>
                    </div>
                    
                </div>
                <div class="row" id="instruction_box">
                    <h5 style="font-size: 15px; font-weight: bold; padding: 10px;">Instructions</h5>
                    <p style="align-content: start;" id="instruction_steps">This is how the recipe works.</p>
                </div>
            </div>
            <div class="col-4" id="quote_box">
                <h1>FOOD <br>FOR <br>THE SOUL</h1>
            </div>
            <!-- <div class="col-3" id="quote_box">

            </div>     -->
        </div>
        <!-- <div class="row instruct_section">
            <div class="col-9" id="instruction_box">

            </div>
            
        </div> -->
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app_recipe.js"></script>
    
</body>

</html>
